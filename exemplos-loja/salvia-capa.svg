<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9F4EC"/>
      <stop offset="0.55" stop-color="#CFE6D6"/>
      <stop offset="1" stop-color="#9CCBA9"/>
    </linearGradient>
    <g id="folha">
      <path d="M0 -90 C 42 -62 48 -8 0 32 C -48 -8 -42 -62 0 -90 Z"/>
    </g>
  </defs>
  <rect width="1200" height="400" fill="url(#fundo)"/>

  <!-- ramos de sálvia nas pontas; o meio fica livre porque a logo sobe por cima da capa -->
  <g fill="#2A7449" opacity="0.85">
    <use href="#folha" transform="translate(90 330) rotate(-35) scale(1.3)"/>
    <use href="#folha" transform="translate(170 300) rotate(15) scale(1.1)"/>
    <use href="#folha" transform="translate(60 210) rotate(-70) scale(0.9)"/>
  </g>
  <g fill="#1D5A36" opacity="0.6">
    <use href="#folha" transform="translate(240 380) rotate(40) scale(1.2)"/>
    <use href="#folha" transform="translate(1110 90) rotate(150) scale(1.3)"/>
    <use href="#folha" transform="translate(1030 60) rotate(200) scale(1)"/>
  </g>
  <g fill="#2A7449" opacity="0.8">
    <use href="#folha" transform="translate(1140 300) rotate(-140) scale(1.4)"/>
    <use href="#folha" transform="translate(1050 340) rotate(-200) scale(1.1)"/>
    <use href="#folha" transform="translate(960 380) rotate(-160) scale(0.9)"/>
  </g>

  <!-- gotas de esmalte -->
  <g fill="#1D5A36">
    <circle cx="330" cy="90" r="10" opacity="0.35"/>
    <circle cx="880" cy="300" r="14" opacity="0.3"/>
    <circle cx="920" cy="120" r="7" opacity="0.4"/>
    <circle cx="300" cy="250" r="6" opacity="0.4"/>
  </g>
</svg>

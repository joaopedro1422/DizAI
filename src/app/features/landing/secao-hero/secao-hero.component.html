<header id="topo" class="hero">
  <div class="hero__fundo" aria-hidden="true"></div>

  <div class="container hero__grade">
    @let texto = hero();
    <div class="hero__texto">
      <span class="hero__etiqueta">
        <span class="hero__pulso" aria-hidden="true"></span>
        {{ texto.etiqueta }}
      </span>

      <h1 class="hero__titulo">
        {{ texto.titulo[0] }}
        <span class="hero__destaque">{{ texto.titulo[1] }}</span>
        {{ texto.titulo[2] }}
      </h1>

      <p class="hero__descricao">
        <strong>{{ texto.descricaoForte }}</strong>{{ texto.descricao }}
      </p>

      <div class="hero__acoes">
        <a routerLink="/cadastro" [queryParams]="cadastro()" class="btn btn--primario btn--hero">
          Testar grátis
          <app-icone nome="seta" [tamanho]="18" [espessura]="2" />
        </a>
        <a [routerLink]="[]" fragment="recursos" class="btn btn--secundario btn--hero hero__secundario">
          <app-icone nome="setaBaixo" [tamanho]="16" [espessura]="2.2" />
          Ver recursos
        </a>
      </div>

      <ul class="hero__garantias">
        @for (garantia of texto.garantias; track garantia) {
          <li class="hero__garantia">
            <span class="hero__check"><app-icone nome="check" [tamanho]="12" [espessura]="3" /></span>
            {{ garantia }}
          </li>
        }
      </ul>
    </div>

    <div class="hero__vitrine">
      <app-demonstracao-conversa class="hero__demonstracao" [tipo]="tipo()" />
    </div>
  </div>
</header>

<!-- serviços ou produtos, e o segmento -->
<div class="escolha">
  @if (!tipo()) {
  <div class="escolha__tipos" role="radiogroup" aria-label="Tipo de negócio">
    @for (tipo of tipos; track tipo) {
      <button
        type="button"
        role="radio"
        class="escolha__tipo"
        [attr.aria-checked]="reprodutor.tipo() === tipo"
        (click)="reprodutor.tipo() !== tipo && escolher(tipo)"
      >
        <app-icone [nome]="demonstracoes[tipo].icone" [tamanho]="16" [espessura]="2" />
        {{ demonstracoes[tipo].rotulo }}
      </button>
    }
  </div>
  }
  <div class="escolha__segmentos" role="radiogroup" aria-label="Segmento">
    @for (opcao of demonstracoes[reprodutor.tipo()].segmentos; track opcao.id) {
      <button
        type="button"
        role="radio"
        class="escolha__segmento"
        [attr.aria-checked]="segmento().id === opcao.id"
        (click)="escolher(reprodutor.tipo(), opcao.id)"
      >
        {{ opcao.rotulo }}
      </button>
    }
  </div>
</div>

<div class="palco">
  <figure class="celular" [attr.aria-label]="'Conversa de exemplo no WhatsApp com ' + segmento().loja">
    <div class="celular__tela">
      <div class="whatsapp__topo">
        <app-icone nome="voltar" [tamanho]="20" [espessura]="2.2" />
        <span class="whatsapp__avatar" [style.background]="segmento().cor" aria-hidden="true">@if (segmento().logo; as logo) {<img [src]="logo" alt="" />} @else { {{ segmento().inicial }} }</span>
        <span class="whatsapp__contato">
          <span class="whatsapp__nome">{{ segmento().loja }}</span>
          <span class="whatsapp__status">{{ reprodutor.digitando() ? 'digitando…' : 'online' }}</span>
        </span>
      </div>

      <!-- notificação no celular do dono, descendo como um push -->
      <div class="aviso" [class.aviso--visivel]="aviso()" aria-live="polite">
        @if (aviso(); as notificacao) {
          <span class="aviso__icone"><app-icone nome="sino" [tamanho]="16" [espessura]="2" /></span>
          <span class="aviso__textos">
            <span class="aviso__origem">DizAI · no celular {{ segmento().artigo }} {{ segmento().dono }}</span>
            <strong>{{ notificacao.titulo }}</strong>
            <span>{{ notificacao.texto }}</span>
          </span>
        }
      </div>

      <div #rolagem class="whatsapp__conversa" aria-live="polite">
        @for (item of conversa(); track $index) {
          <app-balao-conversa [item]="item" [segmento]="segmento()" />
        }
        @if (reprodutor.digitando()) {
          <div class="digitando" aria-label="O assistente está escrevendo"><i></i><i></i><i></i></div>
        }
      </div>

      <!-- a tela do painel (Pedidos ou Minha Agenda) por cima do WhatsApp, por alguns segundos -->
      @if (reprodutor.telaAtual(); as tela) {
        <app-moldura-tela-demo aria-hidden="true">
          @if (tela.pedido) {
            <app-tela-pedidos-demo [pedido]="tela.pedido" />
          } @else if (tela.agenda) {
            <app-tela-agenda-demo [agenda]="tela.agenda" />
          }
        </app-moldura-tela-demo>
      }

      <div class="whatsapp__rodape" aria-hidden="true">
        <span class="whatsapp__campo">
          <app-icone nome="emoji" [tamanho]="20" />
          Mensagem
        </span>
        <span class="whatsapp__microfone">
          <app-icone nome="microfone" [tamanho]="18" [espessura]="2" />
        </span>
      </div>
    </div>
  </figure>

  <!-- o que o assistente acabou de fazer -->
  <span class="legenda" [class.legenda--visivel]="legenda()" aria-live="polite">
    <app-icone nome="brilho" [tamanho]="16" [espessura]="2" />
    {{ legenda() }}
  </span>
</div>

<div class="rodape">
  <span class="rodape__etapas" aria-hidden="true">
    @for (etapa of etapas(); track etapa) {
      <i [class.feita]="reprodutor.alcancados().has(etapa)"></i>
    }
  </span>
</div>

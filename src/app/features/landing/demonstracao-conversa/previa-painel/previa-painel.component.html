<div class="barra-status">
  <span>9:41</span>
  <span class="barra-status__icones">
    <span class="barra-status__sinal"></span>
    <span class="barra-status__bateria"></span>
  </span>
</div>

<div class="painel">
  <app-resumo-loja />

  <div class="painel__conteudo">
    <app-atalhos-secoes />

    <app-secao-configuracao
      titulo="Quando o cliente quiser fechar"
      descricao="Escolha até onde o assistente vai antes de passar a conversa para você."
    >
      <div class="lista-opcoes">
        @for (modo of modosPedido; track modo.valor) {
          <app-opcao-card [titulo]="modo.rotulo" [descricao]="modo.descricao" [selecionado]="modo.valor === modoPedidoAtual()" />
        }
      </div>
    </app-secao-configuracao>

    <app-secao-configuracao
      titulo="Instruções obrigatórias"
      selo="Prioridade máxima"
      descricao="Regras que o assistente segue acima de qualquer comportamento padrão."
    >
      <p class="instrucoes campo__entrada">{{ instrucoesObrigatorias() }}</p>
    </app-secao-configuracao>
  </div>
</div>

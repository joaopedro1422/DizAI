<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>DizAI — atendente com IA para o WhatsApp</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="O DizAI responde seus clientes no WhatsApp na hora, com os produtos, preços e regras da sua loja.">
  <meta name="theme-color" content="#13204A">
  <!-- favicon: o ícone do DizAI (fundo azul, logo branca); o .ico tem 16, 32 e 48 px -->
  <link rel="icon" type="image/png" sizes="32x32" href="icones/favicon-32.png">
  <link rel="icon" type="image/png" sizes="96x96" href="icones/favicon-96.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- App instalado na tela do celular (PWA) -->
  <!-- use-credentials: manda os cookies ao buscar o manifesto (no ngrok grátis, sem o cookie de confirmação vem a página de aviso) -->
  <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
  <link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="DizAI">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    /* Abertura estilo app nativo: só quando o DizAI é aberto pelo atalho instalado (display-mode standalone) */
    .abertura {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #13204A;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    @media (display-mode: standalone) {
      .abertura { display: flex; }
    }
    .abertura--ios { display: flex; }
    .abertura--saindo { opacity: 0; transform: scale(1.04); pointer-events: none; }
    .abertura__simbolo { width: 92px; height: 92px; animation: abertura-entrada 0.5s ease both; }
    .abertura__balao { fill: #FFC83D; }
    .abertura__ponto { fill: #13204A; animation: abertura-digitando 1.2s ease-in-out infinite; }
    .abertura__ponto:nth-of-type(2) { animation-delay: 0.15s; }
    .abertura__ponto:nth-of-type(3) { animation-delay: 0.3s; }
    .abertura__nome {
      font: 800 28px/1 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
      letter-spacing: -0.05em;
      color: #ffffff;
      animation: abertura-entrada 0.5s 0.1s ease both;
    }
    .abertura__nome span { color: #F7ECCD; }
    @keyframes abertura-entrada { from { opacity: 0; transform: translateY(8px) scale(0.96); } }
    @keyframes abertura-digitando { 0%, 60%, 100% { opacity: 1; } 30% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) {
      .abertura__simbolo, .abertura__nome, .abertura__ponto { animation: none; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- a marca (landings e painel): títulos, texto e números; o Manrope fica para a vitrine pública -->
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&family=Dancing+Script:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Lora:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&family=Pacifico&family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Roboto+Condensed:wght@400;500;600;700&family=Cinzel:wght@400;500;600;700&family=Bodoni+Moda:wght@400;500;600;700&family=DM+Serif+Display&family=Italiana&family=Marcellus&family=Great+Vibes&family=Allura&family=Parisienne&family=Pinyon+Script&family=Alex+Brush&family=Sacramento&family=Satisfy&display=swap"
  rel="stylesheet"
>
</head>
<body>
  <div class="abertura" id="abertura" aria-hidden="true">
    <svg class="abertura__simbolo" viewBox="0 0 48 48" focusable="false">
      <path class="abertura__balao" d="M8 6H22A18 17 0 0 1 22 40H16L8 46Z" />
      <circle class="abertura__ponto" cx="16" cy="23" r="2.7" />
      <circle class="abertura__ponto" cx="23.7" cy="23" r="2.7" />
      <circle class="abertura__ponto" cx="31.4" cy="23" r="2.7" />
    </svg>
    <span class="abertura__nome">Diz<span>AI</span></span>
  </div>
  <script>
    // iPhone antigo não entende display-mode no CSS; o navigator.standalone diz que veio do atalho
    if (window.navigator.standalone) document.getElementById('abertura').classList.add('abertura--ios');
    // o Chrome oferece a instalação antes do Angular carregar: guarda o convite para o InstalacaoAppService
    window.addEventListener('beforeinstallprompt', function (evento) {
      evento.preventDefault();
      window.__dizaiConviteInstalacao = evento;
    });
    // segurança: se o app não carregar, a abertura não fica presa na tela
    setTimeout(function () {
      var abertura = document.getElementById('abertura');
      if (abertura) abertura.remove();
    }, 10000);
  </script>
  <app-root></app-root>
</body>
</html>
